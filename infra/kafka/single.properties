# EduStream single-broker profile (the foundation; docs/ARCHITECTURE.md §11).
# One combined KRaft broker+controller on localhost:9092 / :9093.
#
# First use (or after reset):
#   %KAFKA_HOME%\bin\windows\kafka-storage.bat random-uuid
#   %KAFKA_HOME%\bin\windows\kafka-storage.bat format --standalone -t <uuid> -c infra\kafka\single.properties
# Start:
#   %KAFKA_HOME%\bin\windows\kafka-server-start.bat infra\kafka\single.properties

process.roles=broker,controller
node.id=1
controller.quorum.bootstrap.servers=localhost:9093
listeners=PLAINTEXT://:9092,CONTROLLER://:9093
inter.broker.listener.name=PLAINTEXT
advertised.listeners=PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

# Path without spaces (Kafka's Windows scripts break on spaces)
log.dirs=C:/edustream-kafka/single

# Every replication-related setting is 1 on a single broker.
# Setting only the topic RF to 1 is NOT enough: groups and transactions
# would fail to find enough replicas for their internal topics.
default.replication.factor=1
min.insync.replicas=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1

# Topics are created explicitly by scripts/create_topics.ps1 (typos fail loudly).
auto.create.topics.enable=false
num.partitions=3

# Faster consumer-group formation for demos and tests.
group.initial.rebalance.delay.ms=0

# Retention: 7 days; 1 GB segments (avoids segment deletion on Windows during runs).
log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000

# WINDOWS CRASH GUARD (found in M2, 14 Oct 2026): a record whose timestamp is
# already older than the retention period makes Kafka delete its segment at once,
# the delete fails on Windows (file still mapped), and the broker shuts down.
# The legacy Streams app triggered this with 1970 timestamps (start_time*1000).
# Reject records more than 1 day in the past (or 1 hour in the future) instead:
# the producer gets InvalidTimestampError and the broker stays up.
log.message.timestamp.before.max.ms=86400000
log.message.timestamp.after.max.ms=3600000

num.network.threads=3
num.io.threads=8
num.recovery.threads.per.data.dir=2
